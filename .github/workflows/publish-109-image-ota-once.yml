name: Publish 1.0.9 image OTA hotfix (one shot)

on:
  push:
    branches:
      - hotfix/1.0.9-direct-image-ota
    paths:
      - .github/workflows/publish-109-image-ota-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python .github/scripts/apply_109_image_ota_fix.py
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit hotfix source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/apply_109_image_ota_fix.py
          rm .github/workflows/publish-109-image-ota-once.yml
          git add lib/chat/supabase-direct-chat.ts .github/scripts/apply_109_image_ota_fix.py .github/workflows/publish-109-image-ota-once.yml
          git commit -m "Fix 1.0.9 Direct Chat image file reading"
          git push
      - name: Publish Android OTA to production runtime 1.0.9
        run: npx eas-cli@latest update --channel production --platform android --message "Fix Direct Chat image uploads" --environment production --non-interactive --json
