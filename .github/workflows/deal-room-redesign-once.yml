name: Deal Room redesign (one shot)

on:
  push:
    branches:
      - agent/redesign-deal-room
    paths:
      - .github/workflows/deal-room-redesign-once.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-deal-room
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/redesign_deal_room_once.py
      - run: npm run typecheck
      - run: git diff --check origin/main...HEAD
      - name: Commit validated redesign
        shell: bash
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add 'app/deal/[id].tsx'
          git rm .github/scripts/redesign_deal_room_once.py .github/workflows/deal-room-redesign-once.yml
          git commit -m "Redesign Deal Room execution experience"
          git push origin HEAD:agent/redesign-deal-room
