name: Oracle Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_TESWA_BACKEND_PROVIDER: oracle
      EXPO_PUBLIC_TESWA_ORACLE_API_URL: https://130-110-122-142.sslip.io
      EXPO_PUBLIC_TESWA_ORACLE_AUTH_URL: https://130-110-122-142.sslip.io
      EXPO_PUBLIC_SUPABASE_URL: https://disabled.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: oracle-test-disabled
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SENTRY_ALLOW_FAILURE: 'true'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Configure isolated Oracle preview
        run: |
          node - <<'JS'
          const fs = require('fs');
          const config = require('./app.config.js');
          if (process.env.EXPO_PUBLIC_TESWA_BACKEND_PROVIDER !== 'oracle') throw new Error('Oracle provider required');
          const endpoint = new URL(process.env.EXPO_PUBLIC_TESWA_ORACLE_API_URL);
          if (endpoint.protocol !== 'https:' || endpoint.hostname !== '130-110-122-142.sslip.io') throw new Error('Unexpected Oracle endpoint');
          if (process.env.EXPO_PUBLIC_SUPABASE_URL !== 'https://disabled.invalid') throw new Error('Supabase must remain disabled');
          if (config.expo.android.package !== 'com.teswa.mobile.preview') throw new Error('Production package is forbidden');
          config.expo.name = 'Teswa Oracle';
          config.expo.updates = { ...config.expo.updates, enabled: false, checkAutomatically: 'NEVER' };
          fs.writeFileSync('app.config.js', 'module.exports = ' + JSON.stringify(config, null, 2) + ';\n');
          JS
      - name: Build Oracle preview APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
        run: npx eas-cli@latest build --platform android --profile preview --local --non-interactive
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find . -type f -name '*.apk' ! -path '*/node_modules/*' | head -n 1)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: teswa-oracle-preview-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7
