name: Temporary PR validation
on:
  push:
    branches:
      - agent/redesign-settings-center
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Install temporary lint tooling
        run: npm install --no-save eslint@^9.0.0 eslint-config-expo@~55.0.1
      - name: Configure Expo ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const { defineConfig } = require('eslint/config');
          const expoConfig = require('eslint-config-expo/flat');
          module.exports = defineConfig([...expoConfig]);
          EOF
      - name: ESLint modified files
        run: ./node_modules/.bin/eslint 'app/settings/index.tsx'
      - name: Diff check
        run: git diff --check origin/main...HEAD
