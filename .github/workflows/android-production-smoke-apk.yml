name: Android Production Smoke APK

on:
  push:
    branches:
      - test/production-apk-smoke-20260903
    paths:
      - 'eas.json'
      - '.github/workflows/android-production-smoke-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Production-signed smoke APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication
        run: npx eas-cli@latest whoami

      - name: Build production smoke APK on EAS
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile production-apk-smoke \
            --non-interactive \
            --wait \
            --json | tee eas-production-smoke-apk.json

      - name: Upload EAS build metadata
        uses: actions/upload-artifact@v4
        with:
          name: teswa-production-smoke-apk-metadata
          path: eas-production-smoke-apk.json
          if-no-files-found: error
          retention-days: 7
