name: Oracle OCI Access Probe

on:
  push:
    branches:
      - build/oracle-android-20260909
    paths:
      - '.github/workflows/oracle-oci-access-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
      OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
    steps:
      - name: Report credential channel availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${!1:-}" ]; then printf '%s=true\n' "$1"; else printf '%s=false\n' "$1"; fi; }
          for key in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION OCI_TENANCY OCI_USER OCI_KEY_FINGERPRINT OCI_KEY_CONTENT; do
            present "$key"
          done
          if { [ -n "${OCI_TENANCY_OCID:-}" ] && [ -n "${OCI_USER_OCID:-}" ] && [ -n "${OCI_FINGERPRINT:-}" ] && [ -n "${OCI_PRIVATE_KEY:-}" ]; } || \
             { [ -n "${OCI_TENANCY:-}" ] && [ -n "${OCI_USER:-}" ] && [ -n "${OCI_KEY_FINGERPRINT:-}" ] && [ -n "${OCI_KEY_CONTENT:-}" ]; }; then
            echo 'oci_api_key_channel=AVAILABLE'
          else
            echo 'oci_api_key_channel=UNAVAILABLE'
          fi
