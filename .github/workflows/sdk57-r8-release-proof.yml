name: SDK 57 R8 Release Proof

on:
  push:
    branches:
      - modernize/expo57-platform-20260903
    paths:
      - '.github/workflows/sdk57-r8-release-proof.yml'
      - 'plugins/with-android-release-optimization.js'
      - 'scripts/verify-android-release-readiness.mjs'
      - 'scripts/check-android-elf-alignment.py'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: teswa-sdk57-r8-release-proof
  cancel-in-progress: true

jobs:
  proof:
    name: Build optimized Android release proof
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SENTRY_ALLOW_FAILURE: 'true'

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: modernize/expo57-platform-20260903

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck:app

      - name: Generate clean SDK 57 Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify optimized SDK 57 release configuration
        run: node scripts/verify-android-release-readiness.mjs

      - name: Prove compile and target API 36
        working-directory: android
        shell: bash
        run: |
          cat > /tmp/teswa-sdk-proof.gradle <<'GRADLE'
          gradle.afterProject { project, state ->
            if (project.path == ':app') {
              def androidExt = project.extensions.findByName('android')
              if (androidExt != null) {
                println("TESWA_COMPILE_SDK=" + androidExt.compileSdk)
                println("TESWA_TARGET_SDK=" + androidExt.defaultConfig.targetSdk)
              }
            }
          }
          GRADLE
          ./gradlew :app:tasks -I /tmp/teswa-sdk-proof.gradle --no-daemon --console=plain | tee ../android-sdk-proof.txt
          grep -E 'TESWA_COMPILE_SDK=.*36' ../android-sdk-proof.txt
          grep -E 'TESWA_TARGET_SDK=.*36' ../android-sdk-proof.txt

      - name: Build optimized release AAB
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2'
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain

      - name: Locate AAB and R8 mapping
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          MAPPING_PATH="android/app/build/outputs/mapping/release/mapping.txt"

          if [ -z "$AAB_PATH" ] || [ ! -s "$AAB_PATH" ]; then
            echo "Optimized release AAB was not produced."
            exit 1
          fi

          if [ ! -s "$MAPPING_PATH" ]; then
            echo "R8 mapping.txt is missing or empty."
            exit 1
          fi

          echo "AAB: $AAB_PATH ($(du -h "$AAB_PATH" | cut -f1))"
          echo "R8 mapping: $MAPPING_PATH ($(du -h "$MAPPING_PATH" | cut -f1))"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "mapping_path=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify 16 KB native alignment
        run: python3 scripts/check-android-elf-alignment.py "${{ steps.artifacts.outputs.aab_path }}"

      - name: Upload optimized release proof
        uses: actions/upload-artifact@v4
        with:
          name: teswa-sdk57-r8-release-proof
          path: |
            ${{ steps.artifacts.outputs.aab_path }}
            ${{ steps.artifacts.outputs.mapping_path }}
            android-sdk-proof.txt
          if-no-files-found: error
          retention-days: 7
