name: Refresh package lock once

on:
  push:
    branches:
      - agent/refresh-package-lock

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refresh-package-lock
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refresh-package-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-package-lock-once.yml
          git commit -m "chore: refresh package lock after Stream removal [lockfile-refreshed]"
          git push origin HEAD:agent/refresh-package-lock
