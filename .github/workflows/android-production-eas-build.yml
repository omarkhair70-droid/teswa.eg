name: Android Production EAS Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-production-eas-build.yml'
      - 'plugins/with-android-release-optimization.js'
      - 'scripts/verify-android-release-readiness.mjs'
      - 'app.config.js'
      - 'eas.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teswa-android-production-eas-build
  cancel-in-progress: false

jobs:
  build:
    name: EAS production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN repository secret is missing."
            exit 1
          fi
          npx eas-cli@latest whoami

      - name: Build signed production AAB on EAS
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json | tee eas-production-build.json

      - name: Upload EAS build metadata
        uses: actions/upload-artifact@v4
        with:
          name: teswa-eas-production-build-metadata
          path: eas-production-build.json
          if-no-files-found: error
          retention-days: 14
