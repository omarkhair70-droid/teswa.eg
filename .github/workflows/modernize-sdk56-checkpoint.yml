name: Expo SDK 56 Modernization Checkpoint

on:
  push:
    branches:
      - modernize/expo57-platform-20260903
    paths:
      - '.github/workflows/modernize-sdk56-checkpoint.yml'

permissions:
  contents: write

concurrency:
  group: teswa-sdk56-modernization
  cancel-in-progress: false

jobs:
  upgrade:
    name: Align and verify SDK 56
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SENTRY_ALLOW_FAILURE: 'true'

    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: modernize/expo57-platform-20260903

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Expo to SDK 56
        run: npm install expo@^56.0.0

      - name: Align share-intent with SDK 56
        run: npm install expo-share-intent@^7.0.0

      - name: Align SDK 56 dependency cohort
        run: npx expo install --fix

      - name: Verify Expo dependency health
        run: npx expo-doctor

      - name: TypeScript
        run: npm run typecheck:app

      - name: Guard Expo Router SDK 56 app imports
        run: |
          if grep -R --line-number --include='*.ts' --include='*.tsx' --exclude-dir=node_modules "@react-navigation/" app components lib hooks 2>/dev/null; then
            echo "Direct @react-navigation imports remain in application code."
            exit 1
          fi

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Record SDK 56 checkpoint
        run: |
          cat > docs/TESWA_EXPO56_CHECKPOINT_2026-09-03.md <<'EOF'
          # Teswa Expo SDK 56 Checkpoint

          This checkpoint was generated only after:
          - Expo SDK 56 install
          - `npx expo install --fix`
          - `npx expo-doctor`
          - TypeScript
          - direct React Navigation import guard
          - clean Android prebuild

          SDK 56 is intentionally an intermediate migration checkpoint, not a release target.
          Teswa uses Reanimated/Worklets and Expo documents a Hermes V1 memory regression in SDK 56; SDK 57 resolves it.
          EOF

      - name: Commit verified dependency checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/TESWA_EXPO56_CHECKPOINT_2026-09-03.md
          if git diff --cached --quiet; then
            echo "No checkpoint changes to commit."
            exit 0
          fi
          git commit -m "chore(expo): checkpoint SDK 56 dependency alignment"
          git push origin HEAD:modernize/expo57-platform-20260903
