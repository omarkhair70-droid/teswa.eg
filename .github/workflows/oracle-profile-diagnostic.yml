name: Oracle Profile Diagnostic
on:
  push:
    branches:
      - fix/oracle-profile-query-20260908
    paths:
      - scripts/oci-migration/diagnose_oracle_profile.py
      - scripts/oci-migration/test_oracle_profile_diagnostic.py
      - .github/workflows/oracle-profile-diagnostic.yml
  pull_request:
    paths:
      - scripts/oci-migration/diagnose_oracle_profile.py
      - scripts/oci-migration/test_oracle_profile_diagnostic.py
      - .github/workflows/oracle-profile-diagnostic.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify profile diagnostic
        run: |
          python -m py_compile scripts/oci-migration/diagnose_oracle_profile.py scripts/oci-migration/test_oracle_profile_diagnostic.py
          python -m unittest discover -s scripts/oci-migration -p test_oracle_profile_diagnostic.py -v
