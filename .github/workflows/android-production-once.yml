name: Android Production AAB (One Shot)

on:
  push:
    branches:
      - release/1.0.9
    paths:
      - app.config.js

permissions:
  contents: read

jobs:
  build-production-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production Android bundle on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > eas-build.json
          cat eas-build.json

      - name: Download production AAB
        id: eas_build
        run: |
          BUILD_ID="$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)"
          AAB_URL="$(jq -r 'if type == "array" then .[0].artifacts.applicationArchiveUrl else .artifacts.applicationArchiveUrl end' eas-build.json)"
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ] || [ -z "$AAB_URL" ] || [ "$AAB_URL" = "null" ]; then
            echo "EAS did not return a production Android artifact."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          curl --fail --location "$AAB_URL" --output teswa-1.0.9-production.aab

      - name: Upload production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: teswa-1.0.9-production-aab
          path: teswa-1.0.9-production.aab
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "Production EAS build id: ${{ steps.eas_build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
