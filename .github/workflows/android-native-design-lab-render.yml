name: Android Native Design Lab Render

on:
  pull_request:
    paths:
      - 'android-native/app/src/debug/java/com/teswa/mobile/lab/**'
      - 'android-native/app/src/debug/AndroidManifest.xml'
      - '.github/workflows/android-native-design-lab-render.yml'
  workflow_dispatch:

jobs:
  render-p2-offer-directions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace

      - name: Render P2 directions on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p artifacts/p2

            for direction in PairObject Crossing Tension; do
              adb shell am force-stop com.teswa.mobile
              adb shell am start -W \
                -n com.teswa.mobile/.lab.offer.StructuredOfferLabActivity \
                --es direction "$direction"
              sleep 1
              adb exec-out screencap -p > "artifacts/p2/${direction}.png"
            done

      - name: Upload rendered P2 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: teswa-p2-offer-directions
          path: artifacts/p2/*.png
          if-no-files-found: error
          retention-days: 14
