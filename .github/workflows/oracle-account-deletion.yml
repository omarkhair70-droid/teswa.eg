name: Oracle Account Deletion
on:
  push:
    branches:
      - integration/oracle-domain-closure-20260907
      - fix/oracle-account-deletion-parity-20260909
    paths:
      - scripts/oci-migration/oracle_account.py
      - scripts/oci-migration/runtime-account-deletion.sql
      - scripts/oci-migration/test_oracle_account.py
      - scripts/oci-migration/test_account_deletion_postgres.sql
      - .github/workflows/oracle-account-deletion.yml
  pull_request:
    paths:
      - scripts/oci-migration/oracle_account.py
      - scripts/oci-migration/runtime-account-deletion.sql
      - scripts/oci-migration/test_oracle_account.py
      - scripts/oci-migration/test_account_deletion_postgres.sql
      - .github/workflows/oracle-account-deletion.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teswa_account_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teswa_account_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: teswa_account_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify API and SQL contracts
        run: |
          python -m py_compile scripts/oci-migration/oracle_account.py
          python -m unittest discover -s scripts/oci-migration -p test_oracle_account.py -v
          psql -X -v ON_ERROR_STOP=1 -f scripts/oci-migration/test_account_deletion_postgres.sql
