name: Android Release Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'scripts/verify-android-release-readiness.mjs'
      - 'scripts/check-android-elf-alignment.py'
      - '.github/workflows/android-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-proof:
    name: R8 / AAB / 16KB proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SENTRY_ALLOW_FAILURE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor@1.20.2

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated R8 release configuration
        run: node scripts/verify-android-release-readiness.mjs

      - name: Build release Android App Bundle
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2'
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain

      - name: Locate release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          MAPPING_PATH="android/app/build/outputs/mapping/release/mapping.txt"

          if [ -z "$AAB_PATH" ] || [ ! -s "$AAB_PATH" ]; then
            echo "Release AAB was not produced."
            exit 1
          fi

          if [ ! -s "$MAPPING_PATH" ]; then
            echo "R8 mapping.txt was not produced; release minification/obfuscation is not proven."
            exit 1
          fi

          echo "AAB: $AAB_PATH ($(du -h "$AAB_PATH" | cut -f1))"
          echo "R8 mapping: $MAPPING_PATH ($(du -h "$MAPPING_PATH" | cut -f1))"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "mapping_path=$MAPPING_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify native 16 KB ELF alignment
        run: python3 scripts/check-android-elf-alignment.py "${{ steps.artifacts.outputs.aab_path }}"

      - name: Upload CI release proof
        uses: actions/upload-artifact@v4
        with:
          name: teswa-android-release-ci-proof
          path: |
            ${{ steps.artifacts.outputs.aab_path }}
            ${{ steps.artifacts.outputs.mapping_path }}
          if-no-files-found: error
          retention-days: 7
