name: Android Release Readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'scripts/verify-android-release-readiness.mjs'
      - '.github/workflows/android-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  config-proof:
    name: Android emergency release safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      SENTRY_ALLOW_FAILURE: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor@1.20.2

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify emergency R8 rollback
        run: node scripts/verify-android-release-readiness.mjs
