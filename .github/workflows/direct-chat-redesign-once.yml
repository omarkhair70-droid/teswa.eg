name: Direct Chat conversation redesign (one shot)

on:
  push:
    branches:
      - agent/redesign-direct-conversation
    paths:
      - .github/workflows/direct-chat-redesign-once.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-direct-conversation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python .github/scripts/direct_chat_redesign_once.py
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit finished redesign
        run: |
          rm .github/workflows/direct-chat-redesign-once.yml
          rm .github/scripts/direct_chat_redesign_once.py
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add 'app/direct/[id].tsx' .github/workflows/direct-chat-redesign-once.yml .github/scripts/direct_chat_redesign_once.py
          git commit -m "Redesign Direct Chat conversation experience"
          git push origin HEAD:agent/redesign-direct-conversation
