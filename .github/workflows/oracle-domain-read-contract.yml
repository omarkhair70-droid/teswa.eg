  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authenticated read contract
        run: |
          python -m py_compile scripts/oci-migration/oracle_domain_read.py
          python -m py_compile scripts/oci-migration/oracle_domain_service.py
          python -m py_compile scripts/oci-migration/oracle_exchange_read.py
          python -m py_compile scripts/oci-migration/oracle_exchange_read_extra.py
          python -m py_compile scripts/oci-migration/oracle_media.py
          python -m py_compile scripts/oci-migration/oracle_marketplace_write.py
          python -m py_compile scripts/oci-migration/oracle_exchange.py
          python -m py_compile scripts/oci-migration/oracle_profiles.py
          python -m py_compile scripts/oci-migration/oracle_notifications.py
          python -m py_compile scripts/oci-migration/oracle_reviews.py
          python -m py_compile scripts/oci-migration/oracle_direct_messaging.py
          python -m py_compile scripts/oci-migration/oracle_contextual_messaging.py
          python -m py_compile scripts/oci-migration/oracle_stories.py
          python -m py_compile scripts/oci-migration/oracle_discovery.py
          python -m py_compile scripts/oci-migration/oracle_dolab.py
          python -m py_compile scripts/oci-migration/realtime-shadow-transport.py
          python -m py_compile scripts/oci-migration/deploy-domain-read-shadow.py
          python -m py_compile scripts/oci-migration/domain_exchange_e2e.py
          bash -n scripts/oci-migration/domain-read-shadow-guest-deploy.sh
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_read.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_service.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_exchange_read.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_exchange_read_order.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_exchange_read_extra.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_exchange_offer_reads.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_exchange_lifecycle.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_media.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_marketplace_write.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_write_transaction.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_exchange.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_profiles.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_notifications.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_reviews.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_direct_messaging.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_contextual_messaging.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_stories.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_discovery.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_dolab.py -v
          python -m unittest discover -s scripts/oci-migration -p test_realtime_shadow_transport.py -v
          python -m unittest discover -s scripts/oci-migration -p test_auth_gateway.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Oracle domain adapters and application types
        run: |
          node scripts/test-oracle-marketplace-read-adapter.cjs
          node scripts/test-oracle-media-adapter.cjs
          node scripts/test-oracle-marketplace-write-adapter.cjs
          node scripts/test-oracle-exchange-adapter.cjs
          node scripts/test-oracle-exchange-read-adapter.cjs
          node scripts/test-oracle-exchange-lifecycle-adapter.cjs
          node scripts/test-oracle-exchange-composition.cjs
          node scripts/test-oracle-exchange-read-extra-adapter.cjs
          node scripts/test-oracle-exchange-offer-read-adapter.cjs
          node scripts/test-oracle-profile-core-adapter.cjs
          node scripts/test-oracle-notifications-adapter.cjs
          node scripts/test-oracle-reviews-adapter.cjs
          node scripts/test-oracle-direct-messaging-adapter.cjs
          node scripts/test-oracle-contextual-messaging-adapter.cjs
          node scripts/test-oracle-stories-adapter.cjs
          node scripts/test-oracle-discovery-adapter.cjs
          node scripts/test-oracle-dolab-adapter.cjs
          node scripts/test-oracle-messaging-realtime-adapter.cjs
          npm run typecheck:app
