name: Oracle Marketplace Edit
on:
  push:
    branches:
      - feat/oracle-marketplace-edit-20260908
      - integration/oracle-domain-closure-20260907
    paths:
      - scripts/oci-migration/oracle_marketplace_edit.py
      - scripts/oci-migration/runtime-marketplace-edit.sql
      - scripts/oci-migration/domain-read-edit-guest-deploy.sh
      - scripts/oci-migration/deploy-domain-read-shadow.py
      - scripts/oci-migration/oracle_domain_service.py
      - scripts/oci-migration/auth-api-shadow-gateway.py
      - scripts/oci-migration/test_oracle_marketplace_edit.py
      - scripts/oci-migration/test_marketplace_edit_postgres.sql
      - scripts/test-oracle-marketplace-edit-adapter.cjs
      - lib/backend/adapters/oracle/marketplace-write-adapter.ts
      - .github/workflows/oracle-marketplace-edit.yml
  pull_request:
    branches:
      - integration/oracle-domain-closure-20260907
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify editor, routing and deployment syntax
        run: |
          python -m py_compile scripts/oci-migration/oracle_marketplace_edit.py scripts/oci-migration/oracle_domain_service.py scripts/oci-migration/auth-api-shadow-gateway.py scripts/oci-migration/deploy-domain-read-shadow.py
          python -m unittest discover -s scripts/oci-migration -p test_oracle_marketplace_edit.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_marketplace_lifecycle.py -v
          python -m unittest discover -s scripts/oci-migration -p test_oracle_domain_service.py -v
          python -m unittest discover -s scripts/oci-migration -p test_auth_gateway.py -v
          bash -n scripts/oci-migration/domain-read-edit-guest-deploy.sh
          bash -n scripts/oci-migration/domain-read-shadow-guest-deploy.sh
      - name: Test atomic metadata updates and RLS on disposable PostgreSQL 17
        env:
          PGPASSWORD: ci-only-password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/oci-migration/test_marketplace_edit_postgres.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify TypeScript adapter contracts
        run: |
          node scripts/test-oracle-marketplace-write-adapter.cjs
          node scripts/test-oracle-marketplace-lifecycle-adapter.cjs
          node scripts/test-oracle-marketplace-edit-adapter.cjs
          npx tsc --noEmit
