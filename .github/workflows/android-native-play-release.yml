name: Android Native Play Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        default: feat/native-foundation-network-20260915
        type: string
      target:
        description: Google Play target
        required: true
        default: internal
        type: choice
        options:
          - internal
          - closed
          - production
      closed_track:
        description: Closed-testing track name (used only when target=closed)
        required: false
        default: beta
        type: string
      rollout_percent:
        description: Production rollout percentage (1-100; ignored for testing tracks)
        required: true
        default: '100'
        type: string
      production_confirm:
        description: Type RELEASE_TO_PRODUCTION when target=production
        required: false
        default: ''
        type: string
      api_base_url:
        description: Accepted HTTPS Teswa release API endpoint
        required: true
        default: https://core01.tail6afd9b.ts.net
        type: string

permissions:
  contents: read

concurrency:
  group: teswa-native-play-release-${{ inputs.target }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.teswa.mobile
  EXPECTED_UPLOAD_SHA256: 9E:CE:E2:66:79:C8:7D:4F:6F:51:39:F1:96:7F:ED:20:01:06:C6:C0:FE:42:49:A8:31:8E:F8:84:90:FC:B7:F1
  AAB_PATH: android-native/app/build/outputs/bundle/release/app-release.aab

jobs:
  release:
    name: Build signed native AAB and publish to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate release request
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          CLOSED_TRACK: ${{ inputs.closed_track }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          PRODUCTION_CONFIRM: ${{ inputs.production_confirm }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            internal|closed|production) ;;
            *) echo "Unsupported target: $TARGET"; exit 2 ;;
          esac

          if [[ ! "$API_BASE_URL" =~ ^https://[^/?#]+(/[^?#]*)?$ ]]; then
            echo "api_base_url must be an absolute HTTPS URL without query or fragment."
            exit 3
          fi

          if [[ "$TARGET" == "closed" && -z "${CLOSED_TRACK// }" ]]; then
            echo "closed_track is required when target=closed."
            exit 4
          fi

          if [[ "$TARGET" == "production" ]]; then
            if [[ "$PRODUCTION_CONFIRM" != "RELEASE_TO_PRODUCTION" ]]; then
              echo "Production release blocked. Type RELEASE_TO_PRODUCTION in production_confirm."
              exit 5
            fi
            if ! [[ "$ROLLOUT_PERCENT" =~ ^[0-9]+$ ]] || (( ROLLOUT_PERCENT < 1 || ROLLOUT_PERCENT > 100 )); then
              echo "rollout_percent must be an integer from 1 to 100."
              exit 6
            fi
          fi

      - name: Checkout requested Teswa source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify required release secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TESWA_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TESWA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TESWA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TESWA_RELEASE_KEY_PASSWORD }}
          PLAY_JSON_B64: ${{ secrets.TESWA_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_JSON_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 10
            fi
          done

      - name: Materialize signing and Play credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TESWA_RELEASE_KEYSTORE_B64 }}
          PLAY_JSON_B64: ${{ secrets.TESWA_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/teswa-release"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/teswa-release/upload.jks"
          printf '%s' "$PLAY_JSON_B64" | base64 --decode > "$RUNNER_TEMP/teswa-release/play-service-account.json"
          chmod 600 "$RUNNER_TEMP/teswa-release/upload.jks" "$RUNNER_TEMP/teswa-release/play-service-account.json"

      - name: Verify Google Play upload key fingerprint
        shell: bash
        env:
          TESWA_RELEASE_STORE_PASSWORD: ${{ secrets.TESWA_RELEASE_STORE_PASSWORD }}
          TESWA_RELEASE_KEY_ALIAS: ${{ secrets.TESWA_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/teswa-release/upload.jks"
          ACTUAL="$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias "$TESWA_RELEASE_KEY_ALIAS" \
            -storepass:env TESWA_RELEASE_STORE_PASSWORD \
            | sed -n 's/.*SHA256: //p' | head -n 1)"

          normalize() { printf '%s' "$1" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]'; }

          if [[ "$(normalize "$ACTUAL")" != "$(normalize "$EXPECTED_UPLOAD_SHA256")" ]]; then
            echo "Upload key fingerprint mismatch."
            echo "Expected: $EXPECTED_UPLOAD_SHA256"
            echo "Actual:   $ACTUAL"
            exit 11
          fi
          echo "Upload key fingerprint matches Google Play."

      - name: Run native unit tests
        run: gradle -p android-native :app:testDebugUnitTest --stacktrace

      - name: Compile native release Kotlin
        run: gradle -p android-native :app:compileReleaseKotlin --stacktrace

      - name: Run native release lint
        run: gradle -p android-native :app:lintRelease --stacktrace

      - name: Build signed native release AAB
        shell: bash
        env:
          TESWA_RELEASE_STORE_FILE: ${{ runner.temp }}/teswa-release/upload.jks
          TESWA_RELEASE_STORE_PASSWORD: ${{ secrets.TESWA_RELEASE_STORE_PASSWORD }}
          TESWA_RELEASE_KEY_ALIAS: ${{ secrets.TESWA_RELEASE_KEY_ALIAS }}
          TESWA_RELEASE_KEY_PASSWORD: ${{ secrets.TESWA_RELEASE_KEY_PASSWORD }}
          TESWA_RELEASE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          gradle -p android-native :app:bundleRelease --stacktrace
          test -f "$AAB_PATH"
          jarsigner -verify "$AAB_PATH"
          sha256sum "$AAB_PATH" | tee "$RUNNER_TEMP/teswa-release/aab.sha256"

      - name: Upload signed AAB as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: teswa-native-${{ inputs.target }}-${{ github.run_number }}
          path: |
            ${{ env.AAB_PATH }}
            ${{ runner.temp }}/teswa-release/aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Resolve Google Play track and rollout
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          CLOSED_TRACK: ${{ inputs.closed_track }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            internal)
              TRACK="internal"
              STATUS="completed"
              USER_FRACTION=""
              ;;
            closed)
              TRACK="$CLOSED_TRACK"
              STATUS="completed"
              USER_FRACTION=""
              ;;
            production)
              TRACK="production"
              if [[ "$ROLLOUT_PERCENT" == "100" ]]; then
                STATUS="completed"
                USER_FRACTION=""
              else
                STATUS="inProgress"
                USER_FRACTION="$(python3 - <<PY
print(int("$ROLLOUT_PERCENT") / 100)
PY
)"
              fi
              ;;
          esac

          echo "PLAY_TRACK=$TRACK" >> "$GITHUB_ENV"
          echo "PLAY_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "PLAY_USER_FRACTION=$USER_FRACTION" >> "$GITHUB_ENV"

      - name: Install Google Play API client
        run: python3 -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth

      - name: Upload AAB to existing Teswa app on Google Play
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/teswa-release/play-service-account.json
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          package_name = os.environ["PACKAGE_NAME"]
          aab_path = os.environ["AAB_PATH"]
          track = os.environ["PLAY_TRACK"]
          status = os.environ["PLAY_STATUS"]
          user_fraction_raw = os.environ.get("PLAY_USER_FRACTION", "").strip()
          credentials_file = os.environ["PLAY_SERVICE_ACCOUNT_FILE"]
          source_ref = os.environ.get("SOURCE_REF", "")

          if not Path(aab_path).is_file():
              raise SystemExit(f"AAB missing: {aab_path}")

          creds = service_account.Credentials.from_service_account_file(
              credentials_file,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build("androidpublisher", "v3", credentials=creds, cache_discovery=False)

          edit = service.edits().insert(packageName=package_name, body={}).execute()
          edit_id = edit["id"]

          try:
              bundle = service.edits().bundles().upload(
                  packageName=package_name,
                  editId=edit_id,
                  media_body=MediaFileUpload(
                      aab_path,
                      mimetype="application/octet-stream",
                      resumable=True,
                  ),
              ).execute()

              version_code = str(bundle["versionCode"])
              release = {
                  "name": f"Teswa native {version_code} ({source_ref})",
                  "versionCodes": [version_code],
                  "status": status,
              }
              if user_fraction_raw:
                  release["userFraction"] = float(user_fraction_raw)

              service.edits().tracks().update(
                  packageName=package_name,
                  editId=edit_id,
                  track=track,
                  body={"track": track, "releases": [release]},
              ).execute()

              service.edits().validate(
                  packageName=package_name,
                  editId=edit_id,
              ).execute()

              service.edits().commit(
                  packageName=package_name,
                  editId=edit_id,
              ).execute()
          except Exception:
              try:
                  service.edits().delete(packageName=package_name, editId=edit_id).execute()
              except Exception:
                  pass
              raise

          print(json.dumps({
              "package": package_name,
              "track": track,
              "status": status,
              "versionCode": version_code,
              "sourceRef": source_ref,
          }, indent=2))
          PY

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Teswa Native Google Play release"
            echo ""
            echo "- Package: \`$PACKAGE_NAME\`"
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Track: \`$PLAY_TRACK\`"
            echo "- Status: \`$PLAY_STATUS\`"
            echo "- API: \`${{ inputs.api_base_url }}\`"
            echo "- AAB: \`$AAB_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"
