name: Offer Detail redesign (one shot)

on:
  push:
    branches:
      - agent/redesign-offer-decision
    paths:
      - .github/workflows/offer-detail-redesign-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-offer-decision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: git diff --check main...HEAD
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git rm .github/workflows/offer-detail-redesign-once.yml
          git commit -m "chore: remove offer detail validation runner"
          git push origin HEAD:agent/redesign-offer-decision
