name: Backend Boundary Validation

on:
  push:
    branches:
      - refactor/backend-boundary-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-boundary-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend contracts and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Backend boundary guard
        run: node scripts/check-backend-boundary.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck:app
