name: Android Native Foundation

on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-foundation.yml'
  push:
    branches:
      - 'native/android-kotlin-foundation-20260915'
      - 'native/android-auth-oracle-20260915'
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-foundation.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run native unit tests
        run: gradle -p android-native :app:testDebugUnitTest --stacktrace
      - name: Compile native debug Kotlin
        run: gradle -p android-native :app:compileDebugKotlin --stacktrace
      - name: Compile native release Kotlin
        run: gradle -p android-native :app:compileReleaseKotlin --stacktrace
      - name: Run native release Android lint
        run: gradle -p android-native :app:lintRelease --stacktrace
      - name: Build installable debug APK
        run: gradle -p android-native :app:assembleDebug --stacktrace
      - name: Build debug Android App Bundle
        run: gradle -p android-native :app:bundleDebug --stacktrace
      - name: Upload native preview builds
        uses: actions/upload-artifact@v4
        with:
          name: teswa-native-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/bundle/debug/app-debug.aab
