name: Android Native Foundation

on:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-foundation.yml'
  push:
    branches:
      - 'native/android-kotlin-foundation-20260915'
      - 'native/android-auth-oracle-20260915'
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-foundation.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run native unit tests
        run: gradle -p android-native :app:testDebugUnitTest --stacktrace
      - name: Compile native debug Kotlin
        run: gradle -p android-native :app:compileDebugKotlin --stacktrace
      - name: Compile native release Kotlin
        run: gradle -p android-native :app:compileReleaseKotlin --stacktrace
      - name: Run native Android lint
        run: gradle -p android-native :app:lintDebug --stacktrace
