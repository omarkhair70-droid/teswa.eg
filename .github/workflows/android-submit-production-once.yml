name: Submit Teswa 1.0.9 to Google Play Production

on:
  push:
    branches:
      - release/1.0.9
    paths:
      - .github/workflows/android-submit-production-once.yml

permissions:
  contents: read

jobs:
  submit-production:
    if: github.event.head_commit.message == 'release: submit Teswa 1.0.9 to Google Play'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Submit latest production Android build to Google Play
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest submit --platform android --profile production --latest --non-interactive --wait
