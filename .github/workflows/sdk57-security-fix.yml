name: SDK 57 Production Dependency Security Fix

on:
  push:
    branches:
      - chore/oracle-runtime-cutover-prep-20260910

permissions:
  contents: write

concurrency:
  group: sdk57-production-security-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: chore/oracle-runtime-cutover-prep-20260910
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking production audit fixes to lockfile
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify no high production advisory remains
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Expo SDK compatibility
        run: npx expo-doctor@1.20.2

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'production_security_fix=no_lockfile_changes'
            exit 0
          fi
          git diff --check -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): update patched xmldom transitive versions'
          git push origin HEAD:chore/oracle-runtime-cutover-prep-20260910
