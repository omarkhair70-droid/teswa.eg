name: Item to Offer redesign (one shot)

on:
  push:
    branches:
      - agent/redesign-item-to-offer
    paths:
      - .github/workflows/item-offer-redesign-once.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-item-to-offer
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: python .github/scripts/redesign_item_offer_once.py
      - run: npm run typecheck
      - run: git diff --check

      - name: Commit finished redesign
        shell: bash
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add 'app/item/[id].tsx' 'app/offer/create/[itemId].tsx'
          git rm .github/scripts/redesign_item_offer_once.py .github/workflows/item-offer-redesign-once.yml
          git commit -m "Redesign item-to-offer conversion flow"
          git push origin HEAD:agent/redesign-item-to-offer
